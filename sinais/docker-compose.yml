# Tema 5: Monitoramento de sinais vitais (série temporal: TimescaleDB). Módulo independente do sistema.
# A interface publica a porta 8085 (modulos.json). As demais portas foram deslocadas para não colidir com os outros módulos.
name: sinais
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: vitals_timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-vitals}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: monitoramento-sinais-vitais-api:latest
    container_name: vitals_api
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vitals}
      POSTGRES_USER: ${POSTGRES_USER:-vitals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-local-development-only}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      ALERT_POLL_SECONDS: ${ALERT_POLL_SECONDS:-10}
      SPO2_ALERT_SECONDS: ${SPO2_ALERT_SECONDS:-30}
      HEART_RATE_ALERT_SECONDS: ${HEART_RATE_ALERT_SECONDS:-60}
      HYPOTENSION_ALERT_SECONDS: ${HYPOTENSION_ALERT_SECONDS:-60}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      RANDOMUSER_ENABLED: ${RANDOMUSER_ENABLED:-false}
      RANDOMUSER_API_URL: ${RANDOMUSER_API_URL:-https://randomuser.me/api/}
    ports:
      - "127.0.0.1:${API_PORT:-8086}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: monitoramento-sinais-vitais-api:latest
    container_name: vitals_simulator
    command: ["python", "-u", "-m", "app.simulator"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vitals}
      POSTGRES_USER: ${POSTGRES_USER:-vitals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-local-development-only}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-1}
      API_URL: http://api:8000
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: vitals_grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-development-only}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_COOKIE_SAMESITE: disabled
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://sinais.localhost:8000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      POSTGRES_DB: ${POSTGRES_DB:-vitals}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-local-development-only}
    volumes:
      - grafana-data-v2:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vitals_frontend
    ports:
      - "${FRONTEND_PORT:-8085}:80"
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescale-data:
  grafana-data-v2:
