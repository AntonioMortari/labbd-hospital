apiVersion: 1
deleteDatasources:
  - name: InfluxDB-Vitals
    orgId: 1
datasources:
  - name: TimescaleDB-Vitals
    uid: timescale-vitals
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: ${POSTGRES_DB}
    user: ${GRAFANA_DB_USER}
    isDefault: true
    editable: false
    jsonData:
      postgresVersion: 1600
      timescaledb: true
      sslmode: disable
      maxOpenConns: 20
      maxIdleConns: 5
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
