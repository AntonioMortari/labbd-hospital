<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Gestão Hospitalar</title>
<link rel="preload" href="/kit/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/kit/kit.css?v=2">
<style>
  body { height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 56px minmax(0, 1fr); overflow: hidden; }
  .barra { min-width: 0; display: flex; align-items: center; gap: 24px; padding: 0 16px; background: var(--cartao); border-bottom: 1px solid var(--borda); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--texto); text-decoration: none; white-space: nowrap; }
  .logo .marca-icone { width: 32px; height: 32px; border-radius: 8px; }
  .logo .marca-icone svg { width: 18px; height: 18px; }
  .abas { min-width: 0; display: flex; gap: 4px; overflow-x: auto; height: 100%; align-items: center; }
  .aba { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: var(--raio-c); color: var(--texto-2); text-decoration: none; font-weight: 500; white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
  .aba:hover { background: var(--fundo); color: var(--texto); }
  .aba.ativo { background: var(--destaque-claro); color: var(--destaque-escuro); font-weight: 600; }
  .aba small { font-size: .75rem; color: var(--texto-3); font-weight: 600; }
  .ponto { width: 8px; height: 8px; border-radius: 50%; background: #B8C0CC; }
  .ponto.ok { background: var(--gravado); box-shadow: 0 0 0 3px var(--gravado-claro); }
  .ponto.off { background: var(--recusado); box-shadow: 0 0 0 3px var(--recusado-claro); }
  .palco { position: relative; min-height: 0; }
  .palco > * { position: absolute; inset: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--fundo); }
  .inicio { overflow-y: auto; padding: 40px 32px 56px; }
  @media (max-width: 560px) { .inicio { padding: 24px 16px 40px; } .aba small { display: none; } }
  .inicio .miolo { max-width: 1080px; margin: 0 auto; }
  .inicio h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .inicio .sub-t { margin: 8px 0 28px; color: var(--texto-2); max-width: 62ch; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  .modulo { padding: 20px; display: grid; gap: 10px; align-content: start; }
  .modulo .topo { display: flex; align-items: center; justify-content: space-between; }
  .modulo .tema { font-size: .875rem; font-weight: 600; color: var(--texto-3); }
  .modulo h2 { font-size: 1.0625rem; font-weight: 700; line-height: 1.35; }
  .modulo p { color: var(--texto-2); font-size: .9375rem; }
  .modulo .botao { justify-self: start; text-decoration: none; margin-top: 4px; }
  .rodape-i { margin-top: 28px; color: var(--texto-3); font-size: .875rem; }
  @media (max-width: 720px) { .logo span { display: none; } .barra { gap: 12px; } }
</style>
</head>
<body>
<header class="barra">
  <a class="logo" href="#/" aria-label="Início"><span class="marca-icone"><svg viewBox="0 0 24 24"><path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z"/></svg></span><span>Hospital</span></a>
  <nav class="abas" id="abas" aria-label="Módulos"></nav>
</header>
<main class="palco" id="palco"></main>
<script>
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const porta = location.port ? ":" + location.port : "";
const origem = (id) => `${location.protocol}//${id}.localhost${porta}`;
let modulos = [], estado = {}, atual = "inicio";
const palco = document.getElementById("palco");

function abas() {
  const item = (id, rotulo, tema) => {
    const s = estado[id];
    const ponto = id === "inicio" ? "" : `<span class="ponto ${s === undefined ? "" : s ? "ok" : "off"}" title="${s ? "No ar" : s === false ? "Fora do ar" : "Verificando"}"></span>`;
    return `<a class="aba ${atual === id ? "ativo" : ""}" href="#/${id === "inicio" ? "" : id}" ${atual === id ? 'aria-current="page"' : ""}>${ponto}${tema ? `` : ""}${esc(rotulo)}</a>`;
  };
  document.getElementById("abas").innerHTML = item("inicio", "Início") + modulos.map((m) => item(m.id, m.curto, m.tema)).join("");
}

function inicio() {
  const no = Object.values(estado).filter(Boolean).length;
  return `<div class="miolo"><h1>Sistema de Gestão Hospitalar</h1>
    <p class="sub-t">Cinco módulos, cada um com um tipo de banco de dados, juntos numa só aplicação. Use as abas no topo ou abra um módulo abaixo.</p>
    <div class="grade">${modulos.map((m) => {
      const s = estado[m.id];
      const selo = s === undefined ? '<span class="selo">Verificando…</span>' : s ? '<span class="selo gravado">No ar</span>' : '<span class="selo recusado">Fora do ar</span>';
      return `<article class="cartao modulo"><div class="topo"><span class="tema">Tema ${m.tema}</span>${selo}</div>
        <h2>${esc(m.nome)}</h2><p><b>${esc(m.banco)}</b> · ${esc(m.tipo)}<br>${esc(m.responsaveis.join(", "))}</p>
        <a class="botao ${s ? "primario" : "secundario"}" href="#/${m.id}">${s ? "Abrir" : "Ver aviso do módulo"}</a></article>`;
    }).join("")}</div>
    <p class="rodape-i">${no} de ${modulos.length} módulos no ar.</p></div>`;
}

function mostrar() {
  const id = location.hash.replace(/^#\/?/, "") || "inicio";
  atual = modulos.some((m) => m.id === id) ? id : "inicio";
  // os módulos já abertos continuam vivos (conexões e telas intactas); só alternamos qual aparece
  for (const el of palco.children) el.hidden = el.dataset.id !== atual;
  if (atual === "inicio") {
    let el = palco.querySelector('[data-id="inicio"]');
    if (!el) { el = document.createElement("section"); el.className = "inicio"; el.dataset.id = "inicio"; palco.append(el); }
    el.hidden = false; el.innerHTML = inicio();
  } else if (!palco.querySelector(`[data-id="${atual}"]`)) {
    const m = modulos.find((x) => x.id === atual);
    const f = document.createElement("iframe");
    f.dataset.id = atual; f.title = m.nome;
    f.src = `${origem(m.id)}${m.entrada || "/"}?embed=1`;
    palco.append(f);
  }
  abas();
  document.title = (atual === "inicio" ? "" : modulos.find((m) => m.id === atual).curto + " · ") + "Sistema Hospitalar";
}

async function checar() {
  await Promise.all(modulos.map(async (m) => {
    try { estado[m.id] = (await fetch(`/_health/${m.id}`, { cache: "no-store" })).ok; } catch { estado[m.id] = false; }
  }));
  abas();
  if (atual === "inicio") palco.querySelector('[data-id="inicio"]').innerHTML = inicio();
}

window.addEventListener("hashchange", mostrar);
fetch("/modulos.json", { cache: "no-store" }).then((r) => r.json()).then(async (d) => {
  modulos = d.modulos; mostrar(); await checar(); setInterval(checar, 4000);
});
</script>
</body>
</html>
