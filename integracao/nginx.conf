# GERADO por integracao/sistema.py a partir de modulos.json. Não edite à mão: rode `python3 integracao/sistema.py gerar`.
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  map $http_upgrade $conexao { default upgrade; '' close; }

  # página inicial (hub) em http://localhost
  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    location /kit/ { alias /usr/share/nginx/kit/; }
    location = /modulos.json { alias /etc/nginx/modulos.json; add_header Cache-Control no-store; }
    location = /_health/cadastro {
      proxy_pass http://host.docker.internal:8081/health;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }
    location = /_health/grafo {
      proxy_pass http://host.docker.internal:8082/health;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }
    location = /_health/triagem {
      proxy_pass http://host.docker.internal:8080/health;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }
    location = /_health/prontuario {
      proxy_pass http://host.docker.internal:8084/health;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }
    location = /_health/sinais {
      proxy_pass http://host.docker.internal:8085/health;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }
    location / { try_files $uri /index.html; }
  }

  server {
    listen 80;
    server_name cadastro.localhost;
    location / {
      proxy_pass http://host.docker.internal:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conexao;
      proxy_connect_timeout 2s;
      error_page 502 503 504 = @fora;
    }
    location @fora {
      default_type text/html;
      return 503 "<!doctype html><meta charset=utf-8><title>Cadastro, Equipe Médica e Agendamentos</title><body style='font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#0F172A'><h1>Tema 1 fora do ar</h1><p>O módulo <b>Cadastro, Equipe Médica e Agendamentos</b> não está respondendo na porta 8081.</p><p>Suba o módulo (pasta <code>cadastro/</code>) ou rode <code>python3 integracao/sistema.py subir cadastro</code> e recarregue a página.</p></body>";
    }
  }

  server {
    listen 80;
    server_name grafo.localhost;
    location / {
      proxy_pass http://host.docker.internal:8082;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conexao;
      proxy_connect_timeout 2s;
      error_page 502 503 504 = @fora;
    }
    location @fora {
      default_type text/html;
      return 503 "<!doctype html><meta charset=utf-8><title>Interações Medicamentosas e Rede de Contágio</title><body style='font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#0F172A'><h1>Tema 2 fora do ar</h1><p>O módulo <b>Interações Medicamentosas e Rede de Contágio</b> não está respondendo na porta 8082.</p><p>Suba o módulo (pasta <code>grafo/</code>) ou rode <code>python3 integracao/sistema.py subir grafo</code> e recarregue a página.</p></body>";
    }
  }

  server {
    listen 80;
    server_name triagem.localhost;
    location / {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conexao;
      proxy_connect_timeout 2s;
      error_page 502 503 504 = @fora;
    }
    location @fora {
      default_type text/html;
      return 503 "<!doctype html><meta charset=utf-8><title>Fila de Triagem, Leitos e Cache Operacional</title><body style='font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#0F172A'><h1>Tema 3 fora do ar</h1><p>O módulo <b>Fila de Triagem, Leitos e Cache Operacional</b> não está respondendo na porta 8080.</p><p>Suba o módulo (pasta <code>emergencia/</code>) ou rode <code>python3 integracao/sistema.py subir triagem</code> e recarregue a página.</p></body>";
    }
  }

  server {
    listen 80;
    server_name prontuario.localhost;
    location / {
      proxy_pass http://host.docker.internal:8084;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conexao;
      proxy_connect_timeout 2s;
      error_page 502 503 504 = @fora;
    }
    location @fora {
      default_type text/html;
      return 503 "<!doctype html><meta charset=utf-8><title>Prontuário Eletrônico do Paciente (PEP)</title><body style='font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#0F172A'><h1>Tema 4 fora do ar</h1><p>O módulo <b>Prontuário Eletrônico do Paciente (PEP)</b> não está respondendo na porta 8084.</p><p>Suba o módulo (pasta <code>prontuario/</code>) ou rode <code>python3 integracao/sistema.py subir prontuario</code> e recarregue a página.</p></body>";
    }
  }

  server {
    listen 80;
    server_name sinais.localhost;
    location / {
      proxy_pass http://host.docker.internal:8085;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conexao;
      proxy_connect_timeout 2s;
      error_page 502 503 504 = @fora;
    }
    location @fora {
      default_type text/html;
      return 503 "<!doctype html><meta charset=utf-8><title>Monitoramento de Sinais Vitais IoT</title><body style='font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#0F172A'><h1>Tema 5 fora do ar</h1><p>O módulo <b>Monitoramento de Sinais Vitais IoT</b> não está respondendo na porta 8085.</p><p>Suba o módulo (pasta <code>sinais/</code>) ou rode <code>python3 integracao/sistema.py subir sinais</code> e recarregue a página.</p></body>";
    }
  }
}
