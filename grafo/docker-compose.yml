# Tema 2: Interações medicamentosas e rede de contato (banco de grafos: Neo4j). Módulo independente do sistema.
# A API publica a porta 8082 (modulos.json). O Neo4j Browser fica em http://localhost:7474 (neo4j / demonstracao123).
name: grafo
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/demonstracao123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p demonstracao123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: demonstracao123
    ports:
      - "8082:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j-data:
